<script>
/* ---- arranque: usa a versão descarregada mais recente, se existir e se a anterior arrancou bem ---- */
(function(){
  var VER='1.1.1';
  function cmp(a,b){a=String(a).split('.').map(Number);b=String(b).split('.').map(Number);for(var i=0;i<4;i++){var d=(a[i]||0)-(b[i]||0);if(d)return d<0?-1:1;}return 0;}
  window.CDO_VER=VER;window.cdoCmp=cmp;
  try{
    var tr=window.__cdoLoaded?null:localStorage.getItem('cdo_try');
    if(tr){localStorage.setItem('cdo_bad',tr);localStorage.removeItem('cdo_try');localStorage.removeItem('cdo_upd');}
    var u=JSON.parse(localStorage.getItem('cdo_upd')||'null');
    if(u&&u.html&&u.v!==localStorage.getItem('cdo_bad')&&cmp(u.v,VER)>0&&!window.__cdoLoaded){
      window.__cdoLoaded=1;localStorage.setItem('cdo_try',u.v);
      document.open();document.write(u.html);document.close();window.__cdoStop=1;
    }
  }catch(e){}
})();
</script>
<style>

<script>
if(!window.__cdoStop)(function(){
'use strict';
/* remove elementos duplicados deixados pelo resto da página antiga após uma atualização */
(function(){function dd(){var seen={};Array.prototype.slice.call(document.body.children).forEach(function(e){var k=e.tagName==='HEADER'?'header':(e.id||'');if(!k)return;if(seen[k])e.parentNode.removeChild(e);else seen[k]=1;});}
dd();try{new MutationObserver(dd).observe(document.body,{childList:true});}catch(e){}document.addEventListener('DOMContentLoaded',dd);window.addEventListener('load',dd);})();
var REPO='jorgemr0407-dotcom/controlo-diario-obra',KEY='cdo_movel';
var VER=window.CDO_VER,cmp=window.cdoCmp;
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function pad(n){return (n<10?'0':'')+n;}
function fmt(x,d){return Number(x).toLocaleString('pt-PT',{minimumFractionDigits:d||0,maximumFractionDigits:d||0});}
function sg(x){return (x>0?'+':x<0?'−':'')+fmt(Math.abs(x),0);}
function pk(m){var r=Math.round(m);return Math.floor(r/1000)+'+'+String(r%1000).padStart(3,'0');}
function dstr(t){var d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function tstr(t){var d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes());}
function fdl(s){var p=String(s).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s;}
function uid(){return 'm'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
var LADO={E:'Esquerdo',D:'Direito',T:'Largura total'};

/* ---------- estado ---------- */
var S=null;
function vazio(){return {v:1,dev:uid(),obra:'',trocos:[],frentes:[],equipas:{},trocosEm:'',marks:[],envioTs:0,cfg:{tr:'',lado:'E',eq:''}};}
function load(){try{S=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){S=null;}if(!S||!S.marks)S=vazio();S.cfg=S.cfg||{tr:'',lado:'E',eq:''};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('Não consegui guardar no telemóvel (memória cheia?).');}}
var tt=null;
function toast(m){var t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true;},2600);}
function buzz(){try{navigator.vibrate&&navigator.vibrate(60);}catch(e){}}

/* ---------- geometria ---------- */
var GEO={};
function prep(){
  GEO={};
  S.trocos.forEach(function(t){
    if(!t.g||t.g.length<2)return;
    var lat0=t.g[0][1],kx=Math.cos(lat0*Math.PI/180),P=t.g.map(function(p){return [(p[0]-t.g[0][0])*111320*kx,(p[1]-lat0)*110574];}),cum=[0];
    for(var i=1;i<P.length;i++)cum.push(cum[i-1]+Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]));
    GEO[t.id]={P:P,cum:cum,L:cum[cum.length-1],kx:kx,o:t.g[0],lat0:lat0};
  });
}
function proj(t,lat,lon){
  var g=GEO[t.id];if(!g||!(g.L>0))return null;
  var x=(lon-g.o[0])*111320*g.kx,y=(lat-g.lat0)*110574,best=null;
  for(var i=1;i<g.P.length;i++){
    var a=g.P[i-1],b=g.P[i],dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy,u=l?((x-a[0])*dx+(y-a[1])*dy)/l:0;u=Math.max(0,Math.min(1,u));
    var d=Math.hypot(x-a[0]-u*dx,y-a[1]-u*dy);
    if(!best||d<best.d)best={d:d,s:g.cum[i-1]+u*Math.sqrt(l)};
  }
  var Lm=t.fim-t.ini;
  return {d:best.d,s:best.s,pk:t.ini+(Lm>0?best.s/g.L*Lm:best.s)};
}
function melhor(lat,lon,pref){
  var r=null;
  S.trocos.forEach(function(t){var p=proj(t,lat,lon);if(!p)return;if(!r||p.d<r.p.d-0.5||(pref&&t.id===pref&&p.d<r.p.d+15))r={t:t,p:p};});
  return r;
}
function troco(id){for(var i=0;i<S.trocos.length;i++)if(S.trocos[i].id===id)return S.trocos[i];return null;}

/* ---------- cadeia de marcações por frente (troço + lado) ---------- */
function ativas(){return S.marks.filter(function(m){return !m.anulada;});}
function frente(tr,lado){var l=lado==='T'?'E':lado,f=null;S.frentes.forEach(function(x){if(x.tr===tr&&x.lado===l)f=x;});return f;}
function cadeia(marks){
  /* devolve {id:{base,delta}}; base = marcação anterior da mesma frente, ou o ponto conhecido do PC */
  var out={},por={};
  marks.filter(function(m){return !m.anulada;}).forEach(function(m){var k=m.tr+'|'+(m.lado==='T'?'E':m.lado);(por[k]=por[k]||[]).push(m);});
  Object.keys(por).forEach(function(k){
    var a=por[k].slice().sort(function(x,y){return x.ts-y.ts;}),f=frente(a[0].tr,a[0].lado),base=f?f.pk:null;
    a.forEach(function(m){out[m.id]={base:base,delta:base==null?null:m.pk-base};base=m.pk;});
  });
  return out;
}

/* ---------- GPS ---------- */
var POS=null,GPSERR='',watch=null;
function plug(n){var C=window.Capacitor;return C&&C.Plugins&&C.Plugins[n]&&C.isNativePlatform&&C.isNativePlatform()?C.Plugins[n]:null;}
function gpsOn(){
  var G=plug('Geolocation');
  function got(p){if(!p||!p.coords)return;POS={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy,ts:Date.now()};GPSERR='';if(tab==='marcar')liveUpd();}
  function err(e){GPSERR=(e&&e.message)||'Sem sinal GPS';liveUpd();}
  if(G){
    G.requestPermissions().then(function(){return G.watchPosition({enableHighAccuracy:true,timeout:20000,maximumAge:0},function(p,e){if(e)err(e);else got(p);});}).then(function(id){watch=id;}).catch(err);
  }else if(navigator.geolocation){
    watch=navigator.geolocation.watchPosition(got,function(e){err({message:e.code===1?'Permissão de localização recusada':'Sem sinal GPS'});},{enableHighAccuracy:true,maximumAge:0,timeout:20000});
  }else GPSERR='Este dispositivo não tem GPS';
}

/* ---------- ecrãs ---------- */
var tab='inicio';
var NOMES={ren:'Controlo de Rendimentos',inicio:'Página inicial',marcar:'Controlo da Camada de Desgaste',lista:'Controlo da Camada de Desgaste',dados:'Dados e cópias'};
var HOME=[{"k": "pav", "svg": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M8 21 10 3M16 21 14 3\"/><path d=\"M12 5v2M12 11v2M12 17v2\"/></svg>", "n": "Controlo da Camada de Desgaste", "s": "Registo e controlo de áreas e quantidades"}, {"k": "reg", "svg": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 3 3 8l9 5 9-5-9-5Z\"/><path d=\"m3 13 9 5 9-5\"/></svg>", "n": "Controlo da Camada de Regularização", "s": "Registo e controlo de áreas e quantidades"}, {"k": "sin", "svg": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 3 2.5 20h19L12 3Z\"/><path d=\"M12 10v4M12 17v.5\"/></svg>", "n": "Sinalização Rodoviária", "s": "Sinalização temporária e definitiva"}, {"k": "loc", "svg": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21Z\"/><circle cx=\"12\" cy=\"9.5\" r=\"2.5\"/></svg>", "n": "Intervenções Localizadas", "s": "Trabalhos pontuais"}, {"k": "mg", "svg": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"m3 6 6-2 6 2 6-2v14l-6 2-6-2-6 2V6Z\"/><path d=\"M9 4v14M15 6v14\"/></svg>", "n": "Visão Geral da Obra", "s": "Estado e localização dos trabalhos"}, {"k": "map", "svg": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"2\"/><path d=\"m3 16 5-5 4 4 3-3 6 6\"/><circle cx=\"8.5\" cy=\"8.5\" r=\"1.5\"/></svg>", "n": "Cartografia e Mapas", "s": "Mapas de fundo"}, {"k": "rel", "svg": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 3h9l4 4v14H6V3Z\"/><path d=\"M14 3v5h5M9 13h7M9 17h7\"/></svg>", "n": "Relatórios de Obra", "s": "Relatórios em PDF"}, {"k": "ren", "svg": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 20V10M10 20V4M16 20v-8M22 20H2\"/></svg>", "n": "Controlo de Rendimentos", "s": "Previsto vs. realizado"}, {"k": "bk", "svg": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><ellipse cx=\"12\" cy=\"6\" rx=\"8\" ry=\"3\"/><path d=\"M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6\"/></svg>", "n": "Cópias de Segurança", "s": "Backup e restauro"}];
function secao(t){return t==='lista'?'marcar':t;}
function show(t){
  tab=t;try{localStorage.setItem('cdo_tab',t);}catch(e){}

function barra(){
  $('hk').textContent=S.obra||'Obra';
  $('sub').innerHTML=(tab==='inicio'?'':'<button class="home" data-go="inicio">⌂ Início</button>')+'<span class="st">'+esc(NOMES[tab]||'')+'</span>';

function tabsDes(){
  return '<div class="tabs" role="tablist"><button data-go="marcar" aria-selected="'+(tab==='marcar')+'">Marcar</button><button data-go="lista" aria-selected="'+(tab==='lista')+'">Registos ('+ativas().length+')</button></div>';
}
function render(){
  barra();
  if(tab==='inicio')rInicio();else if(tab==='ren')rRend();else if(tab==='marcar')rMarcar();else if(tab==='lista')rLista();else rDados();
}
function rInicio(){
  var ok={pav:'marcar',ren:'ren',bk:'dados'},pc={rel:1},h='<div class="card"><p class="mut" style="margin:0">Escolhe o módulo com que queres trabalhar.</p>';
  h+='<div class="sm mut" style="margin-top:8px">'+(S.trocos.length?'<b style="color:var(--tx)">'+esc(S.obra||'Obra')+'</b> · '+S.trocos.length+' troços · '+ativas().length+' marcações':'Ainda não carregaste os troços (separador Dados).')+'</div></div>';
  h+='<div class="hgrid">'+HOME.map(function(c){
    var on=ok[c.k],tag=on?'Aceder ›':(pc[c.k]?'Só no PC':'Em breve');
    return '<button class="hc'+(on?'':' off')+'" '+(on?'data-go="'+on+'"':'data-off="'+c.k+'"')+'><span class="hi">'+c.svg+'</span><span class="hm"><span class="hn">'+esc(c.n)+'</span><span class="hs">'+esc(c.s)+'</span></span><span class="ho">'+tag+'</span></button>';
  }).join('')+'</div>';
  $('main').innerHTML=h;
}
function posInfo(){
  if(!POS)return null;
  var pref=S.cfg.tr,r=melhor(POS.lat,POS.lon,S.cfg.auto===false?pref:pref);
  return r;
}
function selTroco(){
  /* troço efetivo: o escolhido à mão, ou o mais próximo do GPS */
  var info=posInfo();
  if(S.cfg.man&&troco(S.cfg.tr))return {t:troco(S.cfg.tr),p:POS?proj(troco(S.cfg.tr),POS.lat,POS.lon):null,man:true};
  return info?{t:info.t,p:info.p,man:false}:null;
}
function rMarcar(){
  var h='';
  if(!S.trocos.length){
    h+=tabsDes()+'<div class="card"><h2>Falta carregar os troços</h2><p class="mut">Abre o separador <b>Dados</b> e carrega o ficheiro de troços que a aplicação do PC exporta («Exportar troços para o telemóvel»).</p><div class="btns"><button class="btn" data-go="dados">Ir para Dados</button></div></div>';
    $('main').innerHTML=h;return;
  }
  h=tabsDes()+'<div class="card"><h2>Onde estou</h2><div id="live"></div></div>';
  h+='<div class="btns" style="margin:0 0 12px"><button class="btn mark" id="b-marcar">MARCAR POSIÇÃO AGORA</button></div><div id="aviso"></div>';
  h+='<div class="card"><label style="margin-top:0">Troço</label><select id="s-tr"><option value="">Automático (mais próximo)</option>'+S.trocos.slice().sort(function(a,b){return String(a.cod).localeCompare(String(b.cod),'pt',{numeric:true});}).map(function(t){return '<option value="'+esc(t.id)+'"'+(S.cfg.man&&S.cfg.tr===t.id?' selected':'')+'>'+esc(t.cod)+' · '+esc(t.via)+'</option>';}).join('')+'</select>';
  h+='<label>Lado</label><div class="seg" id="s-lado">'+['E','D','T'].map(function(l){return '<button data-l="'+l+'" aria-pressed="'+(S.cfg.lado===l)+'">'+({E:'Esquerdo',D:'Direito',T:'Total'}[l])+'</button>';}).join('')+'</div>';

var PCK='cdo_pc',PC=null,BAR=2.37;

function rdBlob(b){return new Promise(function(ok,ko){if(b.arrayBuffer){b.arrayBuffer().then(ok,ko);return;}var r=new FileReader();r.onload=function(){ok(r.result);};r.onerror=ko;r.readAsArrayBuffer(b);});}
/* lê só o «dados.json» de um ZIP do PC, sem carregar o ficheiro todo (as fotografias não interessam) */
function lerDadosZip(file){
  var sz=file.size,ini=Math.max(0,sz-70000);
  return rdBlob(file.slice(ini,sz)).then(function(buf){
    var v=new DataView(buf),p=-1;
    for(var i=buf.byteLength-22;i>=0;i--){if(v.getUint32(i,true)===0x06054b50){p=i;break;}}
    if(p<0)throw new Error('zip');
    var n=v.getUint16(p+10,true),cdSize=v.getUint32(p+12,true),cdOff=v.getUint32(p+16,true);
    if(cdOff===0xFFFFFFFF)throw new Error('zip64');
    return rdBlob(file.slice(cdOff,cdOff+cdSize)).then(function(cb){
      var d=new DataView(cb),o=0,u8=new Uint8Array(cb);
      for(var k=0;k<n;k++){
        if(d.getUint32(o,true)!==0x02014b50)break;
        var m=d.getUint16(o+10,true),cs=d.getUint32(o+20,true),nl=d.getUint16(o+28,true),el=d.getUint16(o+30,true),cl=d.getUint16(o+32,true),lh=d.getUint32(o+42,true),nome=new TextDecoder().decode(u8.subarray(o+46,o+46+nl));
        if(nome==='dados.json'){
          return rdBlob(file.slice(lh,lh+30)).then(function(hb){
            var h=new DataView(hb),dOff=lh+30+h.getUint16(26,true)+h.getUint16(28,true);
            return rdBlob(file.slice(dOff,dOff+cs));
          }).then(function(raw){
            if(m===0)return new Uint8Array(raw);
            if(m===8&&typeof DecompressionStream!=='undefined'){return new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer().then(function(a){return new Uint8Array(a);});}
            throw new Error('metodo');
          });
        }
        o+=46+nl+el+cl;
      }
      throw new Error('sem dados.json');
    });
  });
}
function leve(o){var r={};Object.keys(o||{}).forEach(function(k){var v=o[k];if(v==null||typeof v==='number'||typeof v==='boolean'||(typeof v==='string'&&v.length<=200))r[k]=v;});return r;}
function lista(m){return Object.keys(m||{}).map(function(id){var d=leve(m[id]);d.id=id;return d;});}

function carregarPC(file){
  var ini=rdBlob(file.slice(0,2));

  });
}

function pHav(a,b){var R=6371008.8,r=Math.PI/180,dl=(b[1]-a[1])*r,dn=(b[0]-a[0])*r,x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a[1]*r)*Math.cos(b[1]*r)*Math.sin(dn/2)*Math.sin(dn/2);return 2*R*Math.asin(Math.sqrt(x));}

}

  if(t.id==='r-ini'){RP.ini=t.value;rRend();return;}
  if(t.id==='f-tr'&&t.files[0]){lerFicheiro(t.files[0],function(er,d){if(er)toast(er);else carregarTrocos(d);t.value='';});return;}
  if(t.id==='f-bk'&&t.files[0]){lerFicheiro(t.files[0],function(er,d){if(er){toast(er);return;}if(!d||d.tipo!=='cdo-copia'||!d.estado||!Array.isArray(d.estado.marks)){toast('Isto não é uma cópia desta aplicação.');return;}S=d.estado;save();prep();toast('Cópia restaurada ('+S.marks.length+' marcações).');render();t.value='';});return;}
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.id==='e-pk'){ED.pk=Number(String(t.value).replace(',','.'));$('e-pkt').textContent=isFinite(ED.pk)?'= PK '+pk(ED.pk):'';diff();}
  else if(t.id==='e-nota')ED.nota=t.value;
});

/* ---------- arranque ---------- */
load();loadPC();prep();$('hv').textContent='v'+VER;
try{var lt=localStorage.getItem('cdo_tab');if(lt&&NOMES[lt])tab=lt;}catch(e){}
show(tab);gpsOn();setInterval(function(){if(tab==='marcar'&&$('sheet').hidden)liveUpd();},1000);
try{localStorage.removeItem('cdo_try');}catch(e){}
setTimeout(function(){if(navigator.onLine!==false)atualizar(false);},4000);
window.__cdoDebug={S:function(){return S;},POS:function(){return POS;}};
})();
</script>
