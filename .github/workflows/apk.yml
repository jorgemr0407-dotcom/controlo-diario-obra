name: APK do telemóvel
on:
  workflow_dispatch:
  push:
    paths:
      - 'movel/package.json'
      - 'movel/capacitor.config.json'
      - 'movel/android-res/**'
      - '.github/workflows/apk.yml'
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar dependências
        working-directory: movel
        run: npm install --no-audit --no-fund
      - name: Criar o projeto Android
        working-directory: movel
        run: |
          npx cap add android
          cp -r android-res/. android/app/src/main/res/
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          npx cap sync android
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          t=open(p,encoding='utf-8').read()
          add='<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n    '
          assert t.count('<application')==1
          open(p,'w',encoding='utf-8').write(t.replace('<application',add+'<application',1))
          PY
          cat >> android/app/build.gradle <<EOF

          android {
              signingConfigs {
                  debug {
                      storeFile file('$GITHUB_WORKSPACE/movel/keystore/debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          }
          EOF
      - name: Chave de assinatura fixa
        run: |
          mkdir -p ~/.android
          cp movel/keystore/debug.keystore ~/.android/debug.keystore
      - name: Construir o APK
        working-directory: movel/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Publicar o APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp movel/android/app/build/outputs/apk/debug/app-debug.apk Controlo-Obra.apk
          gh release delete movel-apk --yes --cleanup-tag || true
          gh release create movel-apk Controlo-Obra.apk --title "Controlo Obra (Android)" --notes "APK da aplicação do telemóvel. Instala por cima da anterior; os dados mantêm-se." --target "${{ github.sha }}"
